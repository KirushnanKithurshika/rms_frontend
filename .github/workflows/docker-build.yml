name: Build and Push Frontend Docker Image

on:
  push:
    branches: ["feature/localDeploy"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/kirushnankithurshika/rms_frontend:feature-localDeploy
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
